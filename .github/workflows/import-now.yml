name: Copy the Spotify accounts to the now service

# One-off: sends each SPOTIFY_COOKIE_<n> secret, with its deck name from profile.toml, to PUT /api/import/<n> on the
# now service (RobyRew/now, now.spotify.robyrew.com). That route only exists while the service has IMPORT_TOKEN set;
# this workflow sends the same value from the secret NOW_IMPORT_TOKEN. The sessions go from the secrets straight to
# the service over HTTPS, where they are checked with Spotify and sealed; nothing here prints them.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy the accounts
        env:
          NOW_IMPORT_TOKEN: ${{ secrets.NOW_IMPORT_TOKEN }}
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          SPOTIFY_COOKIE_1: ${{ secrets.SPOTIFY_COOKIE_1 }}
          SPOTIFY_COOKIE_2: ${{ secrets.SPOTIFY_COOKIE_2 }}
          SPOTIFY_COOKIE_3: ${{ secrets.SPOTIFY_COOKIE_3 }}
          SPOTIFY_COOKIE_4: ${{ secrets.SPOTIFY_COOKIE_4 }}
          SPOTIFY_COOKIE_5: ${{ secrets.SPOTIFY_COOKIE_5 }}
          SPOTIFY_COOKIE_6: ${{ secrets.SPOTIFY_COOKIE_6 }}
          SPOTIFY_COOKIE_7: ${{ secrets.SPOTIFY_COOKIE_7 }}
          SPOTIFY_COOKIE_8: ${{ secrets.SPOTIFY_COOKIE_8 }}
          SPOTIFY_COOKIE_9: ${{ secrets.SPOTIFY_COOKIE_9 }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, tomllib, urllib.error, urllib.request

          token = os.environ.get("NOW_IMPORT_TOKEN", "")
          if not token:
              sys.exit("The secret NOW_IMPORT_TOKEN is not set.")
          with open("profile.toml", "rb") as handle:
              labels = [s.get("label", "") for s in tomllib.load(handle).get("listening", {}).get("spotify", [])]
          copied = failed = 0
          for n in range(1, 10):
              cookie = (os.environ.get(f"SPOTIFY_COOKIE_{n}") or (os.environ.get("SPOTIFY_COOKIE", "") if n == 1 else "")).strip()
              if not cookie:
                  continue
              label = labels[n - 1] if n <= len(labels) else ""
              request = urllib.request.Request(
                  f"https://now.spotify.robyrew.com/api/import/{n}", method="PUT",
                  data=json.dumps({"sp_dc": cookie, "label": label}).encode(),
                  headers={"authorization": f"Bearer {token}", "content-type": "application/json", "user-agent": "robyrew-profile"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      answer = json.loads(response.read())
                  print(f"account {n}: copied ({answer.get('username')}, {answer.get('status')})")
                  copied += 1
              except urllib.error.HTTPError as error:
                  try:
                      code = json.loads(error.read()).get("error", "")
                  except ValueError:
                      code = ""
                  print(f"account {n}: HTTP {error.code} {code}")
                  failed += 1
              except Exception as error:  # only the type: a message could carry part of the request
                  print(f"account {n}: {type(error).__name__}")
                  failed += 1
          print(f"{copied} copied, {failed} failed")
          sys.exit(1 if failed or not copied else 0)
          EOF
