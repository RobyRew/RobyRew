name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - .github/profile/**
      - .github/workflows/refresh.yml

permissions:
  contents: write
  pages: read

concurrency:
  group: refresh-profile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools==4.67.0 brotli==1.2.0

      - name: Build README and images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LIVE: ${{ vars.LIVE_NOW_PLAYING }}
        run: python3 .github/profile/build.py

      - name: Commit and push to main
        run: |
          git add README.md img .github/profile/cache.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::error::main rejected the push. Remove the branch protection rule on main (Settings > Branches) so this workflow can update the profile."
            exit 1
          fi
