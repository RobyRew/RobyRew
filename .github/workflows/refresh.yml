name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - .github/profile/**
      - .github/workflows/refresh.yml

permissions:
  contents: write
  pages: read
  actions: write

concurrency:
  group: refresh-profile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A change to the code or the profile changes the record player too, so publish it alongside.
      - name: Redeploy the live record player
        if: github.event_name != 'schedule' && vars.LIVE_NOW_PLAYING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run now-playing.yml --repo "$GITHUB_REPOSITORY" --ref main

      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools==4.67.0 brotli==1.2.0

      - name: Build, commit and push to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_REFRESH_TOKEN_2: ${{ secrets.SPOTIFY_REFRESH_TOKEN_2 }}
          SPOTIFY_REFRESH_TOKEN_3: ${{ secrets.SPOTIFY_REFRESH_TOKEN_3 }}
          SPOTIFY_REFRESH_TOKEN_4: ${{ secrets.SPOTIFY_REFRESH_TOKEN_4 }}
          SPOTIFY_REFRESH_TOKEN_5: ${{ secrets.SPOTIFY_REFRESH_TOKEN_5 }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERS: ${{ vars.LASTFM_USERS }}
          LIVE: ${{ vars.LIVE_NOW_PLAYING }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build on the newest main; if main moves while building (a push, another run), start over.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 .github/profile/build.py
            git add README.md img .github/profile/cache.json
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit --quiet -m "Refresh profile [skip ci]"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "main moved while building, trying again ($attempt/3)"
            sleep 10
          done
          echo "::error::Could not push to main after 3 tries. If main is protected, allow GitHub Actions to push to it."
          exit 1
