name: Now playing

# Publishes the parts of the record player that change with the music (the deck, the song, artist, album and
# listening profile) to GitHub Pages, plus a redirect page for each of their links, so the record spins and the
# links follow the music without a commit every few minutes.
# Turn it on with the repository variable LIVE_NOW_PLAYING=true (see .github/profile/SETUP.md).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: now-playing
  cancel-in-progress: true

jobs:
  live:
    if: vars.LIVE_NOW_PLAYING == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # SpotAPI reads the Spotify accounts' players (https://github.com/Aran404/SpotAPI); pinned, since it gets
      # the accounts' web sessions.
      - name: Install font tools and SpotAPI
        run: pip install fonttools==4.67.0 brotli==1.2.0 spotapi==2.1.3 wreq==0.12.3

      - id: pages
        uses: actions/configure-pages@v6

      - name: Render the record player
        id: render
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SPOTIFY_COOKIE_1: ${{ secrets.SPOTIFY_COOKIE_1 }}
          SPOTIFY_COOKIE_2: ${{ secrets.SPOTIFY_COOKIE_2 }}
          SPOTIFY_COOKIE_3: ${{ secrets.SPOTIFY_COOKIE_3 }}
          SPOTIFY_COOKIE_4: ${{ secrets.SPOTIFY_COOKIE_4 }}
          SPOTIFY_COOKIE_5: ${{ secrets.SPOTIFY_COOKIE_5 }}
          SPOTIFY_COOKIE_6: ${{ secrets.SPOTIFY_COOKIE_6 }}
          SPOTIFY_COOKIE_7: ${{ secrets.SPOTIFY_COOKIE_7 }}
          SPOTIFY_COOKIE_8: ${{ secrets.SPOTIFY_COOKIE_8 }}
          SPOTIFY_COOKIE_9: ${{ secrets.SPOTIFY_COOKIE_9 }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERS: ${{ vars.LASTFM_USERS }}
        run: python3 .github/profile/build.py --live _site ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - if: steps.render.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - if: steps.render.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
