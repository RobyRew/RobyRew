name: Now-playing Worker

# Puts .github/worker on Cloudflare Workers (free plan), so the record player shows what's playing on every visit
# instead of every few minutes. Runs once the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
# set (see .github/profile/SETUP.md), and again whenever the Worker changes.

on:
  push:
    branches: [main]
    paths:
      - .github/worker/**
      - .github/workflows/worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the Worker."

      - if: env.READY == 'true'
        uses: actions/checkout@v7

      - if: env.READY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Deploy
        if: env.READY == 'true'
        working-directory: .github/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          npx --yes wrangler@4 deploy
          # Only the secrets that are set. The Spotify side comes from the now service's public /api/now (NOW_API in
          # wrangler.toml) or from kit.json, so the Worker needs no Spotify secret of its own.
          node -e '
            const names = ["LASTFM_API_KEY"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(set));
          '
          npx --yes wrangler@4 secret bulk secrets.json
          rm secrets.json
