text><text x="52" y="71" class="f-italic" font-size="17.5" fill="#6B6761">36 public repositories, from full macOS apps to small tools that fix one annoying thing.</text><text x="0" y="134" class="f-mono" font-size="12" fill="#6B6761" letter-spacing="1">B2</text><text x="52" y="134" class="f-serif" font-size="26" fill="#1C1B19">Native, always</text><line x1="227.8" y1="133" x2="749.3" y2="133" stroke="#6B6761" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0 6.5"/><text x="765.3" y="134" class="f-mono" font-size="11" fill="#6B6761" letter-spacing="1.7">PRINCIPLE</text><text x="52" y="163" class="f-italic" font-size="17.5" fill="#6B6761">Apple Silicon first, no emulation. The best UI framework is the one shipped with the OS.</text><text x="0" y="226" class="f-mono" font-size="12" fill="#6B6761" letter-spacing="1">B3</text><text x="52" y="226" class="f-serif" font-size="26" fill="#1C1B19">Reverse engineering for fun</text><line x1="374.48" y1="225" x2="732.7" y2="225" stroke="#6B6761" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0 6.5"/><text x="748.7" y="226" class="f-mono" font-size="11" fill="#6B6761" letter-spacing="1.7">AFTER HOURS</text><text x="52" y="255" class="f-italic" font-size="17.5" fill="#6B6761">Taking binaries apart in IDA Pro, just to see how they tick.</text></svg>
