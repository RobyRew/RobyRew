# Everything on the profile page comes from this file.
# Edit it, push to main, and the "Refresh profile" workflow rebuilds README.md and img/.
# Build locally with:  pip install fonttools brotli && python3 .github/profile/build.py
#
# Placeholders you can use in any text:
#   {repos}  number of public repositories      {since}  year you joined GitHub
#   {years}  years on GitHub
#
# Hues (a card's tint, best matched to the project's icon): blue, violet, sky, teal, green, ember, rose, graphite
# Icons: a file in .github/profile/icons/ (a .png or .svg), or a line icon: presentation, map, chat, pdf, layers, code,
#        globe, send, music, laptop, phone, door, terminal, archive, wand, user, repo, download

[me]
github = "RobyRew"
name = "RobyRew"
person = "Cosmin Calin"
role = "SysOps"
# Optional, under my name: `statement` (a few lines), `aside` (one line in the accent colour) and `facts` (small
# print, on computers).
# Where my own tile links to.
website = "https://cosmincalin.es"
# The line over my name. Empty shows my latest push among the projects on this page; latest_push = false shows none.
now = ""
latest_push = false
# Printed around the label of the spinning record.
record = "RobyRew · Side A · 33 RPM · apps, tools & tinkering · "

# Two to a row: the icon, the name and `note` (one short line; it overrides the repo description).
[work]
kicker = ""
title = "Projects"

[[work.projects]]
repo = "TopPresenter"
note = "Bible & worship slides for macOS"
icon = "TopPresenter.png"
hue = "violet"

[[work.projects]]
repo = "chat-converter"
title = "Chat Converter"
note = "Move chats between apps"
icon = "chat-converter.svg"
hue = "blue"

[[work.projects]]
repo = "mapswitch"
title = "MapSwitch"
note = "Open any map link in your map app"
icon = "mapswitch.png"
hue = "teal"

[[work.projects]]
repo = "pacetimer"
title = "PeaceTimer"
note = "A Liquid Glass menu-bar timer"
icon = "pacetimer.png"
hue = "sky"

[[work.projects]]
repo = "striker"
title = "Striker"
note = "A live Objective-C console for iOS"
icon = "terminal"
hue = "rose"

[[work.projects]]
repo = "spotify-versions-history"
title = "Spotify versions"
note = "Every Spotify desktop installer"
icon = "spotify-versions-history.svg"
hue = "green"

# Music. Setup steps are in .github/profile/SETUP.md.
# Priority: the Spotify accounts first (up to 9, read through SpotAPI, no Premium or developer app needed), then the
# Last.fm accounts below, top to bottom. The first one that is playing shows on the deck, else the latest play.
[listening]
# Top tracks of the last month, on a card of their own (Last.fm). 0 = no card.
tracks = 0
# Optional: your Spotify profile URL, so the top-tracks card links to it.
profile = ""
# The now-playing Worker (see .github/profile/SETUP.md): the record player is drawn on every visit, with the now
# service and Last.fm asked live. Empty = the image the daily build makes.
worker = "https://robyrew-now.cosmin-calin22.workers.dev"
# The now service (RobyRew/now, see .github/profile/SETUP.md): keeps the Spotify accounts connected all the time.
# While it answers, the workflows take the Spotify side from it and sign in to no account themselves; the
# Worker reads it through NOW_API in .github/worker/wrangler.toml. Empty = read the accounts here.
now_api = "https://now.spotify.robyrew.com/api/now"

# Spotify accounts: add each one with `python3 .github/profile/spotify_login.py <n>` (n = 1 to 9), which saves its web
# session as the secret SPOTIFY_COOKIE_<n>. Optional: a name for the deck, one block per account in the same order
# (without one, the deck shows the account's username).
[[listening.spotify]]
label = "Cosmin Calin"

[[listening.spotify]]
label = "cosmin.cg22"

[[listening.spotify]]
label = "yahoo"

# Last.fm accounts (free, up to 5). `platform` is the label on the deck, since Last.fm can't tell which app
# played a song. Copy the block for more accounts; blocks with an empty user are ignored.
[[listening.lastfm]]
user = ""
platform = "Spotify"

[[listening.lastfm]]
user = ""
platform = "YouTube Music"

[[listening.lastfm]]
user = ""
platform = "Apple Music"

# The last row: where to find me. Icons as above.
[[contact]]
label = "Website"
value = "cosmincalin.es"
url = "https://cosmincalin.es"
icon = "globe"

[[contact]]
label = "LinkedIn"
value = "in/cosmincaliin"
url = "https://www.linkedin.com/in/cosmincaliin"
icon = "user"

[[contact]]
label = "Telegram"
