# Everything on the profile page comes from this file.
# Edit it, push to main, and the "Refresh profile" workflow rebuilds README.md and img/.
# Build locally with:  pip install fonttools brotli && python3 .github/profile/build.py
#
# Placeholders you can use in any text:
#   {repos}  number of public repositories      {since}  year you joined GitHub
#   {years}  years on GitHub
#
# Colours (hue): ember, teal, blue, rose, green, graphite
# Icons: presentation, map, chat, pdf, layers, code, globe, send, music

[me]
github = "RobyRew"
name = "RobyRew"
statement = "Native-stack purist, building apps for Apple platforms."
aside = "If it doesn't compile to metal, I'm not interested."
# Printed around the label of the spinning record.
record = "RobyRew · Side A · 33⅓ RPM · Native software · Barcelona · "

# The first fact goes in the pill at the top, the rest become chips.
[[me.facts]]
label = "Currently"
value = "Building TopPresenter"

[[me.facts]]
label = "Day job"
value = "Deutsche Telekom"
icon = "briefcase"

[[me.facts]]
label = "Based in"
value = "Barcelona, Spain"
icon = "pin"

# Buttons under the record player. The first one is also where your name links to.
# `short` is the label on phones, where the buttons are narrower.
[[links]]
label = "robyrew.com"
url = "https://robyrew.com"
icon = "globe"
hue = "ember"

[[links]]
label = "@RobyRew on Telegram"
short = "Telegram"
url = "https://t.me/RobyRew"
icon = "send"
hue = "blue"

# Side A. The first project gets the big card, the rest sit in a grid.
# Language and stars come from GitHub; `note` overrides the repo description.
[work]
title = "Selected work"

[[work.projects]]
repo = "TopPresenter"
note = "Bible & worship presentation for macOS, built natively with SwiftUI and SwiftData."
hue = "ember"
icon = "presentation"

[[work.projects]]
repo = "mapswitch"
note = "Open any map link in the app you actually use. A privacy-first map redirector."
hue = "teal"
icon = "map"

[[work.projects]]
repo = "chatforge"
note = "Converts chat exports from Telegram, WhatsApp, Instagram and more, in the browser."
hue = "blue"
icon = "chat"

[[work.projects]]
repo = "Download-AI-Chat-PDF"
note = "Userscript that saves a whole ChatGPT, Gemini, Claude or Grok chat as a PDF."
hue = "rose"
icon = "pdf"

[[work.projects]]
repo = "spotify-versions-history"
note = "A searchable catalog of Spotify desktop installers, logging every build and its hashes."
hue = "green"
icon = "layers"

# B-sides: your most recently pushed public repos, picked automatically (featured ones are skipped).
[bsides]
title = "Fresh from the studio"
count = 4

# Side B. Achievements, milestones, things you're proud of. Three fit in a row.
# `url` is where a tile links to (your repositories if left out); `tip` is the hover text.
[highlights]
title = "Highlights"

[[highlights.items]]
value = "{repos}"
title = "Public repositories"
note = "Open source since {since}, from macOS apps to small tools."
hue = "ember"
url = "https://github.com/RobyRew?tab=repositories"
tip = "All my repositories"

[[highlights.items]]
value = "arm64"
title = "Native, always"
note = "No emulation. The best UI framework ships with the OS."
hue = "teal"
url = "https://github.com/RobyRew?tab=repositories&language=swift"
tip = "My Swift repositories"

[[highlights.items]]
value = "Ghidra"
title = "Reverse engineering"
note = "Taking binaries apart in Ghidra and IDA Pro. RE is the fun part."
hue = "rose"
texture = "hex"
url = "https://ghidra-sre.org"
tip = "Ghidra, the reverse engineering suite I use"

# Music. Setup steps are in .github/profile/SETUP.md.
# Priority: Spotify accounts 1–5 first (needs Spotify Premium), then the Last.fm accounts below, top to bottom.
# The first one that is playing shows on the deck.
[listening]
title = "Last four weeks"
tracks = 5
# Optional: your Spotify profile URL, so the top-tracks card links to it.
profile = ""

# Last.fm accounts (free, up to 5). `platform` is the label on the deck, since Last.fm can't tell which app
# played a song. Copy the block for more accounts; blocks with an empty user are ignored.
[[listening.lastfm]]
user = ""
platform = "Spotify"

[[listening.lastfm]]
user = ""
platform = "YouTube Music"

[[listening.lastfm]]
user = ""
platform = "Apple Music"

# Each value is split on commas into chips (four at most), and each chip links to the tool's website.
# Common tools are known already; add others under [credits.urls], like  "Raycast" = "https://raycast.com"
[credits]
title = "Liner notes"

[[credits.items]]
label = "Instruments"
value = "Swift, SwiftUI, AppKit, UIKit"

[[credits.items]]
label = "Session players"
value = "TypeScript, React, Vite, Tailwind"

[[credits.items]]
label = "Live sound"
value = "Docker, Nginx, Ansible"

[[credits.items]]
label = "Mixed in"
value = "Xcode, VS Code"

[[credits.items]]
label = "Forensics"
value = "Ghidra, IDA Pro"

[[credits.items]]
label = "Recorded on"
value = "Apple Silicon, arm64"

[[credits.items]]
label = "Lighting"
value = "Dark mode only"

[[credits.items]]
label = "Soundtrack"
value = "Spotify, YouTube Music, Apple Music"

[credits.urls]
