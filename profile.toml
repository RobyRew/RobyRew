# Everything on the profile page comes from this file.
# Edit it, push to main, and the "Refresh profile" workflow rebuilds README.md and img/.
# Build locally with:  pip install fonttools brotli && python3 .github/profile/build.py
#
# Placeholders you can use in any text:
#   {repos}  number of public repositories      {since}  year you joined GitHub
#   {years}  years on GitHub
#
# Hues (a card's tint, best matched to the project's icon): blue, violet, sky, teal, green, ember, rose, graphite
# Icons: a file in .github/profile/icons/ (a .png or .svg), or a line icon: presentation, map, chat, pdf, layers, code,
#        globe, send, music, laptop, phone, door, terminal, archive, wand, user, repo, download

[me]
github = "RobyRew"
name = "RobyRew"
person = "Cosmin Calin"
role = "SysOps"
statement = "I build native Apple apps, local-first browser tools and the self-hosted platform they run on."
aside = "And I take apps apart to see how they work."
# The small print under the text, on computers.
facts = ["EN · ES · CA · RO"]
# Where my own tile links to.
website = "https://cosmincalin.es"
# The line over my name. Leave it empty to show my latest push among the projects on this page.
now = ""
# Printed around the label of the spinning record.
record = "RobyRew · Side A · 33 RPM · apps, tools & tinkering · "

# The first project gets the big card, the rest go two to a row.
# `kind` sits under the name; `note` overrides the repo description. Language, release, downloads and the repo's
# homepage come from GitHub; `live` sets the address to show instead (live = "" shows none).
# `mock = "presenter"` draws the app beside the big card; `texture = "disasm"` puts an arm64 listing behind a card.
[work]
kicker = "01 — Work"
title = "Selected work"

[[work.projects]]
repo = "TopPresenter"
kind = "macOS app · SwiftUI + SwiftData"
note = "Bible and worship presentation: scripture, songs, images and video on the projector, styled from one place. 70 free Bible translations, no subscription, no cloud account."
icon = "TopPresenter.png"
hue = "violet"
mock = "presenter"

[[work.projects]]
repo = "chat-converter"
title = "Chat Converter"
kind = "Web app · runs in your browser"
note = "Moves a chat export from Telegram, WhatsApp, Instagram, Messenger or Snapchat into the format another app imports."
icon = "chat-converter.svg"
hue = "blue"
live = "https://chat-converter.robyrew.com"

[[work.projects]]
repo = "mapswitch"
title = "MapSwitch"
kind = "Web app · privacy-first"
note = "Like song.link, but for places: paste a Google Maps, Apple Maps or Waze link and open it in the map app you use."
icon = "mapswitch.png"
hue = "teal"
live = "https://maps.robyrew.com"

[[work.projects]]
repo = "pacetimer"
title = "PeaceTimer"
kind = "macOS menu-bar app"
note = "A Liquid Glass countdown in the menu bar: drag along a glowing track to set up to five hours."
icon = "pacetimer.png"
hue = "sky"
live = ""

[[work.projects]]
repo = "striker"
title = "Striker"
kind = "iOS · reverse engineering"
note = "An Objective-C runtime console you embed in an iOS app and drive from your Mac over USB."
icon = "terminal"
hue = "rose"
texture = "disasm"

[[work.projects]]
repo = "spotify-versions-history"
